apiVersion: apps/v1
kind: Deployment
metadata:
  name: mango
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mango
  template:
    metadata:
      labels:
        app: mango
    spec:
      containers:
        - name: mango
          image: mongo:6
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: mango
spec:
  selector:
    app: mango
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP
