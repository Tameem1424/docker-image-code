apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mern-frontend
  template:
    metadata:
      labels:
        app: mern-frontend
    spec:
      containers:
        - name: mern-frontend
          image: tameem325/mern-stack-project:mern-frontend-new-v1
          ports:
            - containerPort: 80
          

---
apiVersion: v1
kind: Service
metadata:
  name: mern-frontend
spec:
  selector:
    app: mern-frontend
  ports:
    - port: 2000
      targetPort: 80
  type: ClusterIP
